schema_version: 1

context:
  name: nettle
  version: "3.10.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # The COPYINGv2, COPYINGv3 and COPYING.LESSERv3 license files referenced by
  # about.license_file ship inside this tarball, so they don't need to be
  # downloaded separately. The previous per-file downloads pointed at the
  # moving `master` branch and broke once upstream edited those files.
  - url: https://ftp.gnu.org/gnu/${{ name }}/${{ name }}-${{ version }}.tar.gz
    sha256: fe9ff51cb1f2abb5e65a6b8c10a92da0ab5ab6eaf26e7fc2b675c45f1fb519b5

build:
  number: 0
  skip: win

requirements:
  build:
    - if: unix
      then: libtool
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - autoconf
    - m4
    - make
  host:
    - gmp
  ignore_run_exports:
    from_package:
      # This is only needed for the test suite
      - ${{ compiler('cxx') }}
  run_exports:
    - ${{ pin_subpackage('nettle', upper_bound='x.x') }}

tests:
  - script:
      - test -f ${PREFIX}/lib/libnettle${SHLIB_EXT}
      - test -f ${PREFIX}/lib/libhogweed${SHLIB_EXT}
      - test ! -f ${PREFIX}/lib/libnettle.a
      - test ! -f ${PREFIX}/lib/libhogweed.a

about:
  license: GPL-2.0-or-later OR LGPL-3.0-or-later
  license_file:
    - COPYINGv2
    - COPYINGv3
    - COPYING.LESSERv3
  summary: Nettle is a low-level cryptographic library that is designed to fit easily in more or less any context
  description: |
    Nettle is a low-level cryptographic library that is designed to fit easily in more or less any context.
    In crypto toolkits for object-oriented languages (C++, Python, Pike, ...), in applications like LSH or GNUPG, or even in kernel space.
    Simple, fast, extensible JSON encoder/decoder for Python
  homepage: https://www.lysator.liu.se/~nisse/nettle/
  repository: https://git.lysator.liu.se/nettle/nettle
  documentation: https://www.lysator.liu.se/~nisse/nettle/nettle.html

extra:
  recipe-maintainers:
    - sachalau
    - erykoff
